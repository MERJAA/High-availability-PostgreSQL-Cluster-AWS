
name: Deploy Zero-Touch HA Database Cluster

on:
  push:
    branches:
      - main
  workflow_dispatch: 

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read


jobs:
  provision-and-configure:
    name: Terraform & Ansible Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Automated AWS OIDC Debugger
        if: failure() || true # Runs even if previous steps fail
        run: |
          # 1. Get a completely fresh token
          LIVE_JWT=$(curl -sH "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
          
          # 2. Extract and print the sub claim so you can see it clearly
          echo "=== LIVE WORKFLOW CLAIMS ==="
          echo "$LIVE_JWT" | cut -d'.' -f2 | base64 --decode 2>/dev/null | jq '{aud, sub, iss}'
          
          # 3. Attempt role assumption and catch the encoded error
          echo "=== ATTEMPTING LIVE ROLE ASSUMPTION ==="
          aws sts assume-role-with-web-identity \
            --role-arn "arn:aws:iam::881893826881:role/github-actions-terraform-role" \
            --role-session-name "RunnerDebugSession" \
            --web-identity-token "$LIVE_JWT" \
            --region ${{ env.AWS_REGION }}

      # ==========================================
      # PHASE 1: TERRAFORM (OIDC Identity)
      # ==========================================
      - name: Configure AWS Credentials (TERRAFORM)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init Cluster
        working-directory: ./terraform-ec2-cluster
        run: terraform init

      - name: Terraform Apply Cluster
        working-directory: ./terraform-ec2-cluster
        run: terraform apply -auto-approve

      
        # ==========================================
      # PHASE 2: ANSIBLE (OIDC Identity Switch)
      # ==========================================
      # This step overwrites the previous temporary token with a new restricted one!

      - name: Configure AWS Credentials (ANSIBLE)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ANSIBLE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python & Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible boto3 botocore
          ansible-galaxy collection install amazon.aws

      - name: Install AWS Session Manager Plugin
        run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb

      - name: Run Ansible Playbook
        working-directory: ./ansible
        run: |
          ansible-playbook -i aws_ec2.yml site.yml